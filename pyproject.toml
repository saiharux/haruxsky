[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
gui = ["customtkinter>=5.2.0"]
build = ["pyinstaller>=6.0"]

[project]
name = "haruxsky"
version = "0.1.0"
description = "Customizable AI Bluesky automation — posts and replies that sound like you"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "HaruxSky", email = "hello@saiharux.github"}
]
dependencies = [
  "atproto>=0.0.50",
  "feedparser>=6.0.10",
  "beautifulsoup4>=4.12.0",
  "requests>=2.31.0",
  "openai>=1.30.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.7.0",
  "typer[all]>=0.12.0",
  "pyyaml>=6.0",
  "rich>=13.0.0",
  "customtkinter>=5.2.0",
]

[project.scripts]
haruxsky = "haruxsky.cli:app"
haruxsky-gui = "haruxsky.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/haruxsky"]
